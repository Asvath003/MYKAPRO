name: Connect Agriculture Workspace
on:
  push:
    branches: [main]
jobs:
  connect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Connect agriculture route
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = "  const switchSector = (sector: Sector) => {\n    if (sector.id === 'health') {\n      window.location.href = '/healthcare';\n      return;\n    }"
          new = "  const switchSector = (sector: Sector) => {\n    if (sector.id === 'health') {\n      window.location.href = '/healthcare';\n      return;\n    }\n    if (sector.id === 'agri') {\n      window.location.href = '/agriculture';\n      return;\n    }"
          if old not in s:
              raise SystemExit('Expected switchSector block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git commit -m 'Connect Agriculture sector to /agriculture' || true
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/connect-agriculture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/connect-agriculture.yml
          git commit -m 'Remove temporary agriculture connector workflow' || true
          git push
