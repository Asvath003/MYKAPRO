name: Connect Healthcare Simulator

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  connect-healthcare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect Healthcare sector to dedicated page
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/page.tsx')
          text = path.read_text(encoding='utf-8')

          old = """  const switchSector = (sector: Sector) => {\n    setSelected(sector); setResources(sector.resources.map(r => r.value)); setPriorities(sector.priorities.map(p => p.value)); setConstraints(sector.constraints.map(c => c.value));\n    setHistory([]); setAiText(''); setAiError(''); setScenarioMode('Balanced'); setView('dashboard');\n  };"""

          new = """  const switchSector = (sector: Sector) => {\n    if (sector.id === 'health') {\n      window.location.href = '/healthcare';\n      return;\n    }\n    setSelected(sector); setResources(sector.resources.map(r => r.value)); setPriorities(sector.priorities.map(p => p.value)); setConstraints(sector.constraints.map(c => c.value));\n    setHistory([]); setAiText(''); setAiError(''); setScenarioMode('Balanced'); setView('dashboard');\n  };"""

          if old not in text:
              raise SystemExit('Target switchSector block was not found; no changes made.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "feat: open healthcare simulator from main page"
          git push

      - name: Remove one-shot workflow
        if: success()
        run: |
          git rm .github/workflows/connect-healthcare.yml
          git commit -m "chore: remove one-shot healthcare connector"
          git push
